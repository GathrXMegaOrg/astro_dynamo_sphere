name: Python Deployment to S3

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.x

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install boto3  # AWS SDK for Python

      - name: Run the Python script to generate the status
        run: |
          python status_update.py

      - name: Debug - Check if the bucket name is set correctly
        run: |
          echo "S3 Bucket Name: $AWS_S3_BUCKET_NAME"
        env:
          AWS_S3_BUCKET_NAME: ${{ secrets.AWS_S3_BUCKET_NAME }}

      - name: Upload status to AWS S3
        run: |
          echo "Uploading to S3 bucket: $AWS_S3_BUCKET_NAME"
          aws s3 cp deployment_status.txt s3://$AWS_S3_BUCKET_NAME/deployment_status.txt
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          AWS_S3_BUCKET_NAME: ${{ secrets.AWS_S3_BUCKET_NAME }}

      - name: Create deployment in GitHub API
        id: create_deployment
        run: |
          response=$(curl -X POST \
            -H "Authorization: token ${{ secrets.GToken }}" \
            -H "Accept: application/vnd.github.v3+json" \
            -d '{
                  "ref": "refs/heads/main",
                  "task": "deploy",
                  "environment": "production",
                  "description": "Upload status to AWS S3",
                  "required_contexts": []
                }' \
            "https://api.github.com/repos/${{ github.repository }}/deployments")
          echo "response=$response"
          deployment_id=$(echo $response | jq -r .id)
          echo "deployment_id=$deployment_id" >> $GITHUB_ENV

      - name: Set Deployment Status to Pending
        run: |
          curl -X POST \
            -H "Authorization: token ${{ secrets.GToken }}" \
            -H "Accept: application/vnd.github.v3+json" \
            -d '{
                  "state": "pending",
                  "description": "Deployment is in progress",
                  "context": "deploy"
                }' \
            "https://api.github.com/repos/${{ github.repository }}/deployments/${{ env.deployment_id }}/statuses"

      - name: Update Deployment Status to Success
        run: |
          curl -X POST \
            -H "Authorization: token ${{ secrets.GToken }}" \
            -H "Accept: application/vnd.github.v3+json" \
            -d '{
                  "state": "success",
                  "description": "Deployment completed successfully",
                  "context": "deploy"
                }' \
            "https://api.github.com/repos/${{ github.repository }}/deployments/${{ env.deployment_id }}/statuses"
